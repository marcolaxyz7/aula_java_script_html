<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estrutura</title>
  </head>
  <body>
    <script>
      let peso = 85;
      let altura = 1.75;
      let imc;

      calculoIMC = peso / (altura * altura);

      if (calculoIMC < 18.5) {
        document.write("Abaixo do peso");
      } else if (calculoIMC <= 24.9) {
        document.write("peso normal");
      } else if (calculoIMC <= 29.9) {
        document.write("Sobrepeso");
      } else if (calculoIMC <= 34.9) {
        document.write("Obesidade Grau 1");
      } else if (calculoIMC <= 39.9) {
        document.write("Obesidade Grau 2");
      } else {
        document.write("Obesidade Grau 3");
      }
    </script>
  </body>
</html>
